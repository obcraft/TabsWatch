<!doctype html>
<html><head><meta charset="utf-8"><title>My knowledge — Tabs Watch</title><style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:13px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#15171a;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:14px 28px;background:#fff;border-bottom:1px solid #eceef0}
h1{margin:0;font-size:15px;font-weight:500;white-space:nowrap}
h1 span{color:#1a8f52}
#q{flex:1;max-width:560px;border:1px solid #e0e3e6;border-radius:8px;padding:7px 12px;font:inherit;outline:none}
#q:focus{border-color:#1a8f52}
select{border:1px solid #e0e3e6;border-radius:8px;padding:6px 8px;font:inherit;background:#fff;color:#15171a}
.status{margin-left:auto;display:flex;align-items:center;gap:6px;color:#6b7280;font-size:12px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#c4c8cc}
.dot.on{background:#1a8f52}
button{background:#fff;color:#15171a;border:1px solid #e0e3e6;border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit;font-size:12px}
button:hover{background:#f6f7f8}
button.primary{background:#15171a;color:#fff;border-color:#15171a}
.setup{margin:18px 28px 0;border:1px solid #eceef0;border-radius:10px;padding:16px 18px;display:flex;gap:16px;align-items:center;justify-content:space-between}
.setup b{font-weight:500}
.bar{height:4px;background:#eceef0;border-radius:4px;overflow:hidden;margin-top:8px;width:320px;max-width:100%}
.bar i{display:block;height:100%;background:#1a8f52;width:0}
.muted{color:#6b7280;font-size:12px}
.topics{display:flex;flex-wrap:wrap;gap:6px;padding:16px 28px 0}
.chip{border:1px solid #e0e3e6;border-radius:999px;padding:2px 9px;font-size:11px;color:#3b3f45;background:#fff;cursor:pointer}
.chip.on{border-color:#1a8f52;color:#1a8f52}
.chip small{color:#9aa0a6;margin-left:3px}
h2{font-size:12px;font-weight:500;color:#6b7280;margin:18px 28px 0;text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:12px 28px 40px}
.card{border:1px solid #eceef0;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:7px;cursor:pointer;text-align:left;font:inherit;color:inherit;background:#fff;min-width:0}
.card:hover{border-color:#d9dde0}
.t{font-size:13px;font-weight:500;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.m{font-size:11px;color:#6b7280}
.s{font-size:12px;color:#3b3f45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags span{font-size:11px;color:#6b7280;background:#f6f7f8;border-radius:4px;padding:0 6px}
.empty{padding:70px 28px;text-align:center;color:#6b7280}
.empty b{display:block;color:#15171a;font-weight:500;margin-bottom:4px}
.detail{position:fixed;inset:0;z-index:20;background:#fff;overflow:auto}
.dh{position:sticky;top:0;background:#fff;border-bottom:1px solid #eceef0;padding:12px 28px;display:flex;gap:8px;align-items:center}
.dh .sp{flex:1}
.db{padding:24px 28px 60px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px}
.db h3{font-size:18px;font-weight:500;margin:0 0 4px}
.db h4{font-size:12px;font-weight:500;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;margin:20px 0 6px}
.pt{margin:0 0 10px;padding-left:12px;border-left:2px solid #1a8f52}
.pt q{display:block;color:#6b7280;font-size:12px;margin-top:2px;cursor:pointer}
.src p{margin:0 0 10px;color:#3b3f45}
.src p.hl{background:#eef8f2}
.src p b{color:#9aa0a6;font-weight:400;font-size:11px;margin-right:6px}
@media(max-width:900px){.db{grid-template-columns:1fr}}
.recaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;padding:12px 28px 4px}
.rc{border:1px solid #eceef0;border-radius:10px;padding:16px;min-width:0}
.rc h3{margin:0;font-size:15px;font-weight:500}
.rc h5{margin:12px 0 4px;font-size:11px;font-weight:500;color:#6b7280;text-transform:uppercase;letter-spacing:.06em}
.rp{margin:0 0 6px;padding-left:10px;border-left:2px solid #1a8f52;font-size:12px;color:#3b3f45}
.rp.alt{border-left-color:#e0e3e6}
.rp a{display:block;color:#6b7280;font-size:11px;cursor:pointer;text-decoration:none}
.rp a:hover{color:#1a8f52}
</style><link rel="stylesheet" href="ui.css"></head><body>
<header>
  <h1>Tabs <span>Watch</span></h1>
  <input id="q" placeholder="Search my knowledge…" autocomplete="off">
  <select id="period"><option value="0">All time</option><option value="1">Today</option><option value="7">7 days</option><option value="30">30 days</option></select>
  <select id="site"><option value="">All sites</option></select>
  <div class="status"><span class="dot" id="dot"></span><span id="stat"></span></div>
</header>
<div class="setup" id="setup" hidden>
  <div>
    <b>Install the local AI model</b>
    <div class="muted" id="setupText">One-time download of about 2.2 GB from Hugging Face. After that, summaries are made on this computer, offline. Articles are saved either way.</div>
    <div class="bar" id="bar" hidden><i id="barFill"></i></div>
  </div>
  <button class="primary" id="install">Install model</button>
</div>
<div id="recapWrap"><h2>Your recap · last 14 days</h2><div class="recaps" id="recaps"></div></div>
<h2>Topics</h2>
<div class="topics" id="topics"></div>
<h2 id="listTitle">Recently viewed</h2>
<div class="grid" id="grid"></div>
<div class="detail" id="detail" hidden>
  <div class="dh"><button id="back">← Back</button><span class="sp"></span><button id="retry">Analyse again</button><button id="del">Delete</button><button class="primary" id="orig">Open original</button></div>
  <div class="db" id="dbody"></div>
</div>
<script type="module" src="newtab.js"></script>
</body></html>
