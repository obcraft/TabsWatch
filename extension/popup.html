<!doctype html>
<html><head><meta charset="utf-8"><style>
body{width:400px;margin:0;font:13px system-ui,sans-serif;background:#fff;color:#15171a}
header{padding:12px 14px;border-bottom:1px solid #eceef0;display:flex;justify-content:space-between;align-items:center}
h1{font-size:15px;margin:0;color:#15171a;font-weight:650}
.now{padding:10px 14px;background:#fafbfb;border-bottom:1px solid #eceef0}
.muted{color:#6b7280;font-size:11px}
.row{display:flex;gap:6px;padding:8px 14px;flex-wrap:wrap;align-items:center}
button{background:#fff;color:#15171a;border:1px solid #e0e3e6;border-radius:6px;padding:6px 9px;cursor:pointer;font-size:12px}
button:hover{background:#f6f7f8}
button.p{background:#15171a;color:#fff;border-color:#15171a;font-weight:600}
button.p:hover{background:#33373c}
.tabs button.on{border-color:#1a8f52;color:#1a8f52;font-weight:600}
input[type=checkbox],input[type=number]{accent-color:#1a8f52}
input[type=number]{border:1px solid #e0e3e6;border-radius:5px;padding:3px 4px}
ul{list-style:none;margin:0;padding:0 14px 12px;max-height:300px;overflow:auto}
li{padding:7px 0;border-bottom:1px solid #f1f2f4}
.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
img{width:100%;border-radius:6px;margin-top:4px;border:1px solid #eceef0}
label{display:flex;gap:6px;align-items:center}
</style></head><body>
<header><h1>Tab Watcher</h1><label><input type="checkbox" id="enabled"> On</label></header>
<div class="now" id="now"></div>
<div class="row">
  <button class="p" id="full">Full-page capture</button>
  <button id="dash">Open results</button>
</div>
<div class="row">
  <button id="snap">Snapshot now</button>
  <button id="export">Export JSON</button>
  <button id="clear">Clear</button>
</div>
<div class="row">
  <label><input type="checkbox" id="screenshots"> Screenshots</label>
  <label><input type="checkbox" id="captureText"> Page text</label>
  <label>every <input type="number" id="intervalMin" min="0.5" step="0.5" style="width:44px"> min</label>
</div>
<div class="row tabs"><button data-v="log" class="on">History</button><button data-v="shots">Screenshots</button><button data-v="stats">Time per site</button></div>
<ul id="list"></ul>
<script src="popup.js"></script>
</body></html>
