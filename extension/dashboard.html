<!doctype html>
<html><head><meta charset="utf-8"><title>Tabs Watch — Results</title><style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:13px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:400;background:#fff;color:#15171a;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 28px;background:#fff;border-bottom:1px solid #eceef0}
h1{margin:0;font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}h1::before{display:none}h1 img{display:block}
h1 span{color:#1a8f52}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button{background:#fff;color:#15171a;border:1px solid #e0e3e6;border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit;font-size:12px;font-weight:400}
button:hover{background:#f6f7f8}
button.on{border-color:#1a8f52;color:#1a8f52}
.muted{color:#6b7280;font-size:12px}
a.dl{color:#15171a;text-decoration:none;border:1px solid #e0e3e6;border-radius:6px;padding:5px 10px;font-size:12px;white-space:nowrap}
a.dl:hover{background:#f6f7f8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;padding:18px 28px;background:#fff;align-content:start}
.cap{background:#fff;border:1px solid #eceef0;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:9px;cursor:pointer;text-align:left;font:inherit;color:inherit;min-width:0}
.cap:hover{border-color:#d9dde0;background:#fcfdfd}
.thumb{position:relative;aspect-ratio:16/10;overflow:hidden;border:1px solid #eceef0;border-radius:8px;background:#fff}
.thumb img{display:block;width:100%;height:100%;object-fit:contain;object-position:top center}
.badge{position:absolute;right:7px;bottom:7px;background:rgba(255,255,255,.94);border:1px solid #eceef0;border-radius:999px;padding:1px 7px;font-size:11px;color:#6b7280}
.t{font-size:13px;font-weight:500;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.m{font-size:11px;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:80px 28px;color:#6b7280;text-align:center;background:#fff}
.empty b{display:block;color:#15171a;font-size:14px;font-weight:500;margin-bottom:6px}
.detail{position:fixed;inset:0;z-index:20;background:#fff;display:flex;flex-direction:column}
.detail h2{margin:0;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.meta{color:#6b7280;font-size:11px;margin-top:2px}
.stage{flex:1;overflow:auto;padding:22px 28px;background:#fafbfb}
.stage img{display:block;width:100%;border:1px solid #eceef0;border-radius:8px;background:#fff}
.hint{color:#6b7280;font-size:12px;margin-bottom:10px}
.strip{flex:1;overflow:auto;padding:22px 28px;background:#fafbfb;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;align-content:start}
.frame{min-width:0}
.frame img{display:block;width:100%;border:1px solid #eceef0;border-radius:6px}
.frame div{color:#6b7280;font-size:11px;margin-top:4px}
.thumb iframe.mini{position:absolute;top:0;left:0;width:400%;height:400%;border:0;transform:scale(.25);transform-origin:0 0;pointer-events:none;background:#fff}
.stage iframe{display:block;width:100%;height:100%;min-height:80vh;border:1px solid #eceef0;border-radius:8px;background:#fff}
.stage.code pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,Menlo,monospace;background:#fff;border:1px solid #eceef0;border-radius:8px;padding:16px}
</style><link rel="stylesheet" href="ui.css"></head><body>
<header>
  <h1 aria-label="Tabs Watch"><img src="icon.png" width="22" height="22" alt="" style="display:block"></h1>
  <div class="acts">
    <span id="count" class="muted"></span>
    <button id="export">Export JSON</button>
    <button id="clear">Clear captures</button>
  </div>
</header>
<div id="wrap" class="grid"></div>
<div id="detail" class="detail" hidden>
  <header>
    <div style="min-width:0">
      <h2 id="dtitle"></h2>
      <div class="meta" id="dmeta"></div>
    </div>
    <div class="acts">
      <a class="dl" id="ddl" hidden download>Download HTML</a>
      <button id="dpage" class="on">Page</button>
      <button id="dhtml">HTML</button>
      <button id="dtext">Text</button>
      <button id="dback">Back</button>
    </div>
  </header>
  <div id="dbody" class="stage"></div>
</div>
<script src="dashboard.js"></script>
</body></html>
