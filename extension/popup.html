<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Tabs Watch</title><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="popup.css"></head><body class="popup">
<header><h1 class="brand" aria-label="Tabs Watch"><img src="icon.png" width="30" height="30" alt=""></h1><label class="switch" title="Enable tracking"><input type="checkbox" id="enabled" aria-label="Enable tracking"><span></span></label></header>
<div class="now" id="now"></div><div class="row main-actions"><button class="p" id="full">Save page HTML</button><button id="dash">Saved pages ↗</button></div>
<section id="modelRow" class="model"><div class="model-heading"><span class="model-dot"></span><b>On-device AI</b></div><p id="modelText">One-time download · about 2.2 GB</p><p id="queueText" class="queue" hidden></p><button class="p" id="install">Download model ↓</button></section>
<div class="row settings"><label><input type="checkbox" id="captureText"> Save page text</label><label>Every <input type="number" id="intervalMin" min="0.5" step="0.5" aria-label="Capture interval in minutes"> min</label></div>
<div class="row tabs"><button data-v="log" class="on">History</button><button data-v="stats">Time per site</button></div><ul id="list"></ul>
<div class="row tools"><button id="snap" title="Save current page text" aria-label="Save current page text">＋</button><span class="muted">On this computer only</span><span class="sp"></span><button id="export" title="Export JSON" aria-label="Export JSON">↓</button><button id="clear" title="Clear saved data" aria-label="Clear saved data"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></svg></button></div><script src="popup.js"></script></body></html>
