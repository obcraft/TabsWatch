<!doctype html>
<html><head><meta charset="utf-8"><style>
body{width:380px;margin:0;font:13px system-ui,sans-serif;background:#141816;color:#e8eee4}
header{padding:12px 14px;border-bottom:1px solid #2a312c;display:flex;justify-content:space-between;align-items:center}
h1{font-size:15px;margin:0;color:#bef05a}
.now{padding:10px 14px;background:#1c221e}
.muted{color:#8a978d;font-size:11px}
.row{display:flex;gap:6px;padding:8px 14px;flex-wrap:wrap}
button{background:#2a312c;color:#e8eee4;border:0;border-radius:6px;padding:6px 9px;cursor:pointer;font-size:12px}
button.p{background:#bef05a;color:#141816;font-weight:600}
.tabs button.on{outline:1px solid #bef05a}
ul{list-style:none;margin:0;padding:0 14px 12px;max-height:300px;overflow:auto}
li{padding:7px 0;border-bottom:1px solid #222a24}
.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
img{width:100%;border-radius:6px;margin-top:4px}
label{display:flex;gap:6px;align-items:center}
</style></head><body>
<header><h1>Tab Watcher</h1><label><input type="checkbox" id="enabled"> On</label></header>
<div class="now" id="now"></div>
<div class="row">
  <button class="p" id="snap">Snapshot now</button>
  <button id="export">Export JSON</button>
  <button id="clear">Clear</button>
</div>
<div class="row">
  <label><input type="checkbox" id="screenshots"> Screenshots</label>
  <label><input type="checkbox" id="captureText"> Page text</label>
  <label>every <input type="number" id="intervalMin" min="0.5" step="0.5" style="width:44px"> min</label>
</div>
<div class="row tabs"><button data-v="log" class="on">History</button><button data-v="shots">Screenshots</button><button data-v="stats">Time per site</button></div>
<ul id="list"></ul>
<script src="popup.js"></script>
</body></html>
