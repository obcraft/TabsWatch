<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tabs Watch</title><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="popup.css"></head><body class="popup">
<header><h1 class="brand" aria-label="Tabs Watch"><img src="icon.png" width="30" height="30" alt=""></h1><div class="header-actions"><button class="icon-button" id="themeToggle" aria-label="Switch to dark theme" title="Switch to dark theme" aria-pressed="false"><svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2Z"/></svg><svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button><button class="icon-button" id="openSettings" aria-label="Settings" title="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button></div></header>
<main>
<section class="intro"><div class="grow"><h2 id="nowTitle">Now reading</h2><p id="nowText"></p></div><label class="toggle" title="Save what I read"><span id="stat">Saving</span><input type="checkbox" class="switch" id="enabled" aria-label="Save what I read" checked></label></section>
<p class="error" id="err" role="alert" hidden></p>
<ul class="links" id="nowPage" hidden></ul>
<div class="actions"><button class="primary" id="full">Save page HTML</button><button id="dash">Saved pages ↗</button></div>
<section class="model-banner" id="model" hidden><span class="model-icon" id="modelIcon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></span><div class="grow"><b id="modelTitle"></b><p id="modelText"></p><div class="bar" id="bar" hidden><i id="barFill"></i></div></div><button class="primary" id="install" hidden>Download</button></section>
<section class="block"><div class="block-head"><h3>Your reading</h3><div class="seg" id="tabs" aria-label="Your reading"><button data-v="log" aria-pressed="true">History</button><button data-v="stats" aria-pressed="false">Time per site</button></div></div><ul class="links" id="list" hidden></ul><div class="empty" id="listEmpty" hidden><b>Nothing yet.</b><span>Pages you stay on for a few seconds show up here.</span></div></section>
</main>
<footer><span>Everything stays on this computer.</span><span class="sp"></span><button class="icon-button" id="snap" title="Save current page text" aria-label="Save current page text"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><button class="icon-button" id="export" title="Export JSON" aria-label="Export JSON"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg></button><button class="icon-button" id="clear" title="Clear saved data" aria-label="Clear saved data"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></svg></button></footer>
<script type="module" src="popup.js"></script></body></html>
